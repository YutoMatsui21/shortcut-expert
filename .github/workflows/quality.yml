name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Toolchain
        run: |
          New-Item -ItemType Directory -Force .tools/test-results | Out-Null
          node --version
          npm.cmd --version
          dotnet --version
          npm.cmd run dev:check -- --require=sdk
          exit $LASTEXITCODE
      - run: npm.cmd run dev:install
      - name: Types
        run: npm.cmd run typecheck
      - name: Fast tests
        run: |
          npm.cmd run test:unit 2>&1 | Tee-Object -FilePath .tools/test-results/unit.log
          exit $LASTEXITCODE
      - name: Native policy and fixture process tests
        run: |
          npm.cmd run test:native 2>&1 | Tee-Object -FilePath .tools/test-results/native.log
          exit $LASTEXITCODE
      - name: Build
        run: npm.cmd run build
      - name: App UI and IPC smoke (synthetic input only)
        run: |
          npm.cmd run smoke 2>&1 | Tee-Object -FilePath .tools/test-results/smoke.log
          exit $LASTEXITCODE
      - name: Package the tested build
        run: npm.cmd run package:dir
      - name: Durable storage UI and IPC smoke (synthetic input only)
        run: |
          node scripts/smoke.mjs --storage 2>&1 | Tee-Object -FilePath .tools/test-results/storage-smoke.log
          exit $LASTEXITCODE
      - name: Packaged UI and IPC smoke
        run: |
          npm.cmd run smoke:packaged 2>&1 | Tee-Object -FilePath .tools/test-results/packaged-smoke.log
          exit $LASTEXITCODE
      - name: Packaged durable storage UI and IPC smoke
        run: |
          node scripts/smoke.mjs --packaged --storage 2>&1 | Tee-Object -FilePath .tools/test-results/packaged-storage-smoke.log
          exit $LASTEXITCODE
      - name: Acquired-record comparison and coverage info (isolated SQLite)
        run: |
          node scripts/smoke.mjs --comparison 2>&1 | Tee-Object -FilePath .tools/test-results/comparison-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke.mjs --packaged --comparison 2>&1 | Tee-Object -FilePath .tools/test-results/packaged-comparison-smoke.log
          exit $LASTEXITCODE
      - name: JSON migration and process restart smoke
        run: |
          node scripts/smoke.mjs --migration 2>&1 | Tee-Object -FilePath .tools/test-results/migration-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke.mjs --packaged --migration 2>&1 | Tee-Object -FilePath .tools/test-results/packaged-migration-smoke.log
          exit $LASTEXITCODE
      - name: Settings panel and tray commands (isolated SQLite)
        run: |
          node scripts/smoke.mjs --settings 2>&1 | Tee-Object -FilePath .tools/test-results/settings-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke.mjs --packaged --settings 2>&1 | Tee-Object -FilePath .tools/test-results/packaged-settings-smoke.log
          exit $LASTEXITCODE
      - name: Notification activation and restart (isolated SQLite, fake OS callbacks)
        run: |
          node scripts/smoke.mjs --activation 2>&1 | Tee-Object -FilePath .tools/test-results/activation-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke.mjs --packaged --activation 2>&1 | Tee-Object -FilePath .tools/test-results/packaged-activation-smoke.log
          exit $LASTEXITCODE
      - name: Identify the tested foundation build
        run: |
          $roots = @('out', 'resources/native-helper', 'release/win-unpacked/resources')
          $files = @($roots | ForEach-Object { Get-ChildItem -LiteralPath $_ -File -Recurse })
          $files += Get-Item -LiteralPath 'release/win-unpacked/Window Shortcut Coach.exe'
          $hashes = @($files | Sort-Object FullName | ForEach-Object {
            @{ path = [IO.Path]::GetRelativePath($PWD.Path, $_.FullName); sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
          })
          @{ commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; files = $hashes;
            fixtureOnly = $true; twelveOperationAcceptance = $false } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 .tools/test-results/build-hashes.json
      - name: Fixture diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tools/test-results/*.log
            .tools/test-results/build-hashes.json
            .tools/tests/coach-*/coach-preview.png
            .tools/tests/coach-*/notice-preview.png
            .tools/tests/coach-*/learning-*.png
            .tools/tests/coach-*/learning-layout.json
            .tools/tests/coach-*/records-*.png
            .tools/tests/coach-*/records-layout.json
            .tools/tests/coach-*/records-comparison-*.json
            .tools/tests/coach-*/settings-*.png
            .tools/tests/coach-*/delete-*.png
            .tools/tests/coach-*/save-error-*.png
            .tools/tests/coach-*/save-error-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
