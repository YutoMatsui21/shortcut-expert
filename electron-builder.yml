appId: local.window-shortcut-coach
productName: Shortcut Expert
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - out/main/storage-worker.cjs
  - out/main/chunks/**/*
extraResources:
  - from: resources/native-helper
    to: native-helper
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  createStartMenuShortcut: true
  shortcutName: Shortcut Expert
