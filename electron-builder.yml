appId: local.window-shortcut-coach
productName: Shortcut Expert
artifactName: Shortcut Expert.${ext}
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - out/main/storage-worker.cjs
  - out/main/chunks/**/*
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
extraResources:
  - from: resources/native-helper
    to: native-helper
  - from: build/icon.png
    to: icons/icon.png
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  include: build/installer.nsh
  uninstallDisplayName: Shortcut Expert
  oneClick: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  createStartMenuShortcut: true
  shortcutName: Shortcut Expert
